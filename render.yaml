          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_TEMPLATE_EN
      - key: WHATSAPP_REMINDER_2H_LANGUAGE_EN
        fromService:
          type: web
          name: nyaysetu-bot-backend
