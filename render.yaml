services:
  - type: web
    name: nyaysetu-bot-backend
    runtime: python
    plan: starter
    region: singapore
    autoDeployTrigger: off
    buildCommand: >-
      python -m pip install --disable-pip-version-check --no-deps
      -r requirements.lock && python -m pip check
    preDeployCommand: python -m alembic -c alembic.ini upgrade head
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /health/ready
    domains:
      - api.nyaysetu.in
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      # Render sets WEB_CONCURRENCY from the instance CPU count on newer
      # services. NyaySetu intentionally runs one process until coordination
      # and rate-limit state move to shared infrastructure.
      - key: WEB_CONCURRENCY
        value: "1"
      # Use gunicorn.conf.py as the only process policy; Render's Python
      # default otherwise injects --preload and a duplicate bind argument.
      # The explicit CLI value also wins safely if Gunicorn gives environment
      # arguments precedence over the config file.
      - key: GUNICORN_CMD_ARGS
        value: "--workers 1"
      - key: MAINTENANCE_MODE
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: ALLOW_INSECURE_WEBHOOKS
        value: "false"
      - key: RAZORPAY_MODE
        sync: false
      - key: AI_PROVIDER
        value: local
      - key: AUTO_SEND_RECEIPTS
        value: "false"
      - key: WHATSAPP_API_VERSION
        value: v24.0
      - key: WEBHOOK_REPLAY_WINDOW_SECONDS
        value: "0"
      - key: WEBHOOK_EVENT_TTL_DAYS
        value: "30"
      - key: PROCESSED_MESSAGE_TTL_DAYS
        value: "30"
      - key: ANALYTICS_EVENT_TTL_DAYS
        value: "90"
      - key: OUTBOX_COMPLETED_TTL_DAYS
        value: "30"
      - key: CASE_BRIEF_UNATTACHED_TTL_DAYS
        value: "7"
      - key: PAYMENT_LINK_TTL_MINUTES
        value: "16"
      - key: PAYMENT_RECONCILIATION_LOOKBACK_DAYS
        value: "14"
      - key: RAZORPAY_API_TIMEOUT_SECONDS
        value: "12"
      - key: SUPPORT_SLA_HOURS
        value: "24"
      - key: CONSULTATION_REMINDER_CATCHUP_MINUTES
        value: "30"
      - key: CONSULTATION_REMINDER_BATCH_SIZE
        value: "100"
      - key: AI_CONSENT_VERSION
        value: ai-privacy-2026-07
      - key: BOOKING_TERMS_VERSION
        value: booking-terms-2026-07
      - key: CASE_BRIEF_CONSENT_VERSION
        value: case-brief-sharing-2026-08
      - key: LEGAL_CONTENT_VERSION
        value: legal-content-2026-08-r5
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      # Intentionally operator-supplied rather than linked to an automatically
      # created database. For the fresh release, provision and revision-check
      # the intended empty managed PostgreSQL database before deployment.
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_APP_SECRET_PREVIOUS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET_PREVIOUS
        sync: false
      # Production readiness requires an explicitly supplied, partner-approved
      # amount rather than silently accepting the development default.
      - key: BOOKING_PRICE
        sync: false
      - key: SES_REGION
        value: ap-south-1
      - key: SES_FROM_EMAIL
        sync: false
      - key: SES_CONFIGURATION_SET
        sync: false
      - key: SES_CONNECT_TIMEOUT_SECONDS
        value: "5"
      - key: SES_READ_TIMEOUT_SECONDS
        value: "15"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Leave empty for a normal IAM access key. Populate only when using
      # temporary AWS credentials, then rotate all three values together.
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: BOOKING_NOTIFICATION_EMAILS
        sync: false
      - key: SUPPORT_NOTIFICATION_EMAILS
        sync: false
      - key: PAYMENT_RECONCILIATION_EMAILS
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PRIVACY_EMAIL
        sync: false
      - key: PRIVACY_POLICY_URL
        sync: false
      - key: TERMS_OF_SERVICE_URL
        sync: false
      - key: REFUND_POLICY_URL
        sync: false
      - key: CANCELLATION_POLICY_URL
        sync: false
      - key: LEGAL_CONTENT_REVIEWED_VERSION
        sync: false
      - key: LEGAL_CONTENT_REVIEWED_ON
        sync: false
      # Optional and disabled until every configured pair names an exact
      # Meta-approved utility template with two body variables: date and time.
      - key: WHATSAPP_REMINDER_24H_TEMPLATE_EN
        sync: false
      - key: WHATSAPP_REMINDER_24H_LANGUAGE_EN
        sync: false
      - key: WHATSAPP_REMINDER_24H_TEMPLATE_HI
        sync: false
      - key: WHATSAPP_REMINDER_24H_LANGUAGE_HI
        sync: false
      - key: WHATSAPP_REMINDER_24H_TEMPLATE_MR
        sync: false
      - key: WHATSAPP_REMINDER_24H_LANGUAGE_MR
        sync: false
      - key: WHATSAPP_REMINDER_2H_TEMPLATE_EN
        sync: false
      - key: WHATSAPP_REMINDER_2H_LANGUAGE_EN
        sync: false
      - key: WHATSAPP_REMINDER_2H_TEMPLATE_HI
        sync: false
      - key: WHATSAPP_REMINDER_2H_LANGUAGE_HI
        sync: false
      - key: WHATSAPP_REMINDER_2H_TEMPLATE_MR
        sync: false
      - key: WHATSAPP_REMINDER_2H_LANGUAGE_MR
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AI_SAFETY_IDENTIFIER_SECRET
        generateValue: true

  # The current runner processes a bounded batch and exits, so a cron job is
  # the correct Render service type. It is not a long-running queue consumer.
  - type: cron
    name: nyaysetu-outbox
    runtime: python
    plan: starter
    region: singapore
    autoDeployTrigger: off
    schedule: "* * * * *"
    buildCommand: >-
      python -m pip install --disable-pip-version-check --no-deps
      -r requirements.lock && python -m pip check
    startCommand: python -m jobs.process_outbox
    envVars:
      - key: ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: AUTO_SEND_RECEIPTS
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: AUTO_SEND_RECEIPTS
      - key: WHATSAPP_API_VERSION
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_API_VERSION
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: DATABASE_URL
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: DATABASE_URL
      - key: WHATSAPP_TOKEN
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_TOKEN
      - key: WHATSAPP_PHONE_ID
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_PHONE_ID
      - key: SES_REGION
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: SES_REGION
      - key: SES_FROM_EMAIL
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: SES_FROM_EMAIL
      - key: SES_CONFIGURATION_SET
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: SES_CONFIGURATION_SET
      - key: SES_CONNECT_TIMEOUT_SECONDS
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: SES_CONNECT_TIMEOUT_SECONDS
      - key: SES_READ_TIMEOUT_SECONDS
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: SES_READ_TIMEOUT_SECONDS
      - key: AWS_ACCESS_KEY_ID
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: AWS_SESSION_TOKEN
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: AWS_SESSION_TOKEN
      - key: BOOKING_NOTIFICATION_EMAILS
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: BOOKING_NOTIFICATION_EMAILS
      - key: SUPPORT_NOTIFICATION_EMAILS
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: SUPPORT_NOTIFICATION_EMAILS
      - key: PAYMENT_RECONCILIATION_EMAILS
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: PAYMENT_RECONCILIATION_EMAILS
      - key: CONSULTATION_REMINDER_CATCHUP_MINUTES
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: CONSULTATION_REMINDER_CATCHUP_MINUTES
      - key: WHATSAPP_REMINDER_24H_TEMPLATE_EN
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_24H_TEMPLATE_EN
      - key: WHATSAPP_REMINDER_24H_LANGUAGE_EN
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_24H_LANGUAGE_EN
      - key: WHATSAPP_REMINDER_24H_TEMPLATE_HI
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_24H_TEMPLATE_HI
      - key: WHATSAPP_REMINDER_24H_LANGUAGE_HI
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_24H_LANGUAGE_HI
      - key: WHATSAPP_REMINDER_24H_TEMPLATE_MR
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_24H_TEMPLATE_MR
      - key: WHATSAPP_REMINDER_24H_LANGUAGE_MR
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_24H_LANGUAGE_MR
      - key: WHATSAPP_REMINDER_2H_TEMPLATE_EN
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_TEMPLATE_EN
      - key: WHATSAPP_REMINDER_2H_LANGUAGE_EN
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_LANGUAGE_EN
      - key: WHATSAPP_REMINDER_2H_TEMPLATE_HI
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_TEMPLATE_HI
      - key: WHATSAPP_REMINDER_2H_LANGUAGE_HI
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_LANGUAGE_HI
      - key: WHATSAPP_REMINDER_2H_TEMPLATE_MR
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_TEMPLATE_MR
      - key: WHATSAPP_REMINDER_2H_LANGUAGE_MR
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_LANGUAGE_MR
      - key: AI_SAFETY_IDENTIFIER_SECRET
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: AI_SAFETY_IDENTIFIER_SECRET

  # Payment webhooks remain authoritative. This bounded independent lookup is
  # the safety net for a provider delivery outage or an interrupted callback.
  - type: cron
    name: nyaysetu-payment-reconciliation
    runtime: python
    plan: starter
    region: singapore
    autoDeployTrigger: off
    schedule: "*/5 * * * *"
    buildCommand: >-
      python -m pip install --disable-pip-version-check --no-deps
      -r requirements.lock && python -m pip check
    startCommand: python -m jobs.reconcile_payments --limit 100
    envVars:
      - key: ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: DATABASE_URL
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: DATABASE_URL
      - key: RAZORPAY_MODE
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: RAZORPAY_MODE
      - key: RAZORPAY_KEY_ID
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: RAZORPAY_KEY_ID
      - key: RAZORPAY_KEY_SECRET
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: RAZORPAY_KEY_SECRET
      - key: RAZORPAY_API_TIMEOUT_SECONDS
        fromService:
