      - key: WHATSAPP_REMINDER_2H_LANGUAGE_HI
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_LANGUAGE_HI
      - key: WHATSAPP_REMINDER_2H_TEMPLATE_MR
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_TEMPLATE_MR
      - key: WHATSAPP_REMINDER_2H_LANGUAGE_MR
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: WHATSAPP_REMINDER_2H_LANGUAGE_MR

  # This module exists and only performs conservative, bounded housekeeping.
  # Render cron expressions are UTC; 20:30 UTC is 02:00 Asia/Kolkata.
  - type: cron
    name: nyaysetu-maintenance
    runtime: python
    plan: starter
    region: singapore
    autoDeployTrigger: off
    schedule: "30 20 * * *"
    buildCommand: >-
      python -m pip install --disable-pip-version-check --no-deps
      -r requirements.lock && python -m pip check
    startCommand: >-
      python -m jobs.maintenance --batch-size 500 --fail-on-risk
    envVars:
      - key: ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: DATABASE_URL
