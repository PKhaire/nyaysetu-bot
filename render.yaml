          envVarKey: PAYMENT_RECONCILIATION_LOOKBACK_DAYS
      - key: AUTO_SEND_RECEIPTS
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: AUTO_SEND_RECEIPTS
      - key: BOOKING_NOTIFICATION_EMAILS
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: BOOKING_NOTIFICATION_EMAILS
      - key: PAYMENT_RECONCILIATION_EMAILS
        fromService:
          type: web
          name: nyaysetu-bot-backend
          envVarKey: PAYMENT_RECONCILIATION_EMAILS

  # Scheduling is harmless while template pairs are empty. The outbox worker
  # rechecks the same live configuration immediately before every send.
  - type: cron
    name: nyaysetu-consultation-reminders
    runtime: python
    plan: starter
    region: singapore
    autoDeployTrigger: off
    schedule: "*/10 * * * *"
    buildCommand: >-
      python -m pip install --disable-pip-version-check --no-deps
      -r requirements.lock && python -m pip check
    startCommand: python -m jobs.consultation_reminders
    envVars:
      - key: ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: DATABASE_URL
